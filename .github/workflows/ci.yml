name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Run the PyQt6 GUI test suite without a display on every platform.
  QT_QPA_PLATFORM: offscreen
  # Make the GUI tests fail, instead of silently skipping, when PyQt6 is missing.
  SDR_REQUIRE_GUI: "1"

# Same-repo branches are validated by the push event; the pull_request event
# only matters for pull requests from forks, so each job skips duplicate
# pull_request runs for same-repo heads.
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/sdr-antenna-array/pyproject.toml

      - name: Install Qt runtime libraries (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libpulse0

      - name: Install package with dev extras (includes PyQt6)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/sdr-antenna-array

      - name: Run test suite
        run: python -m pytest --cov=src/sdr_module --cov-report=xml --cov-report=term-missing

      - name: Run antenna-array package tests
        run: python -m pytest packages/sdr-antenna-array/tests

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting with Black
        run: black --check --diff src/ tests/ packages/

      - name: Check import sorting with isort
        run: isort --check-only --diff src/ tests/ packages/

      - name: Lint with Ruff
        run: ruff check src/ tests/ packages/

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/sdr-antenna-array/pyproject.toml

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/sdr-antenna-array

      - name: Run mypy (sdr_module)
        run: mypy src/sdr_module

      - name: Run mypy (sdr_antenna_array)
        run: mypy packages/sdr-antenna-array/src

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Bandit static analysis (medium severity and above)
        run: bandit -q -r src packages/sdr-antenna-array/src -ll

      - name: Audit declared runtime dependencies for known vulnerabilities
        run: |
          python - <<'PY' > audit-requirements.txt
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          requirements = list(project["dependencies"])
          for extra in ("gui", "rtlsdr"):
              requirements += project["optional-dependencies"][extra]
          print("\n".join(requirements))
          PY
          cat audit-requirements.txt
          pip-audit -r audit-requirements.txt

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build packages
        run: |
          python -m build
          python -m build --outdir dist packages/sdr-antenna-array

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Install the wheel into a clean environment and exercise the CLI
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          VENV_PY="${RUNNER_TEMP}/wheel-venv/bin/python"
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install dist/sdr_module-*.whl dist/sdr_antenna_array-*.whl
          "$VENV_PY" -c "import sdr_module, sdr_antenna_array; print('sdr_module', sdr_module.__version__)"
          SDR_SCAN="${RUNNER_TEMP}/wheel-venv/bin/sdr-scan"
          "$SDR_SCAN" --version
          "$SDR_SCAN" info
          "$SDR_SCAN" encode morse --text HELLO -o "${RUNNER_TEMP}/hello.wav"
          "$SDR_SCAN" scan --input "${RUNNER_TEMP}/hello.wav" --threshold -40
          "$SDR_SCAN" channels export --presets "${RUNNER_TEMP}/presets.csv"
          "$SDR_SCAN" channels list "${RUNNER_TEMP}/presets.csv" > /dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
