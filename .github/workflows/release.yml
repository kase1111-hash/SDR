name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version and has a changelog entry
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python tools/get_version.py)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match sdr_module.__version__ (${PKG_VERSION})"
            exit 1
          fi
          if ! grep -q "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG_VERSION}]' section"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Test Package
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install package from wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Test import
        run: |
          python -c "from sdr_module import DeviceManager, DualSDRController; print('Import successful')"

      - name: Test CLI
        run: |
          sdr-scan --version
          sdr-scan info
          sdr-scan encode morse --text HELLO -o "${RUNNER_TEMP}/hello.wav"
          sdr-scan scan --input "${RUNNER_TEMP}/hello.wav" --threshold -40

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sdr-module
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/sdr-module
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    name: Sign & Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          # This job's token is read-only (contents: read), so the action
          # must not try to attach SBOMs to the GitHub release itself —
          # that failed every prior release run. The github-release job
          # uploads dist/* (including the SBOM) with a write token instead.
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz,dist/*.whl'

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-signed
          path: dist/

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, attest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-signed
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body: |
            ## SDR Module v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            ```bash
            pip install sdr-module==${{ steps.version.outputs.version }}
            ```

            ### Verification

            Build provenance attestations are available via `gh attestation verify`.
            SBOM (SPDX) is attached to this release as `sbom.spdx.json`.

            ### Links
            - [PyPI](https://pypi.org/project/sdr-module/${{ steps.version.outputs.version }}/)
            - [Documentation](https://github.com/kase1111-hash/SDR#readme)
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'a') || contains(steps.version.outputs.version, 'b') || contains(steps.version.outputs.version, 'rc') }}
