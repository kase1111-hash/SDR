[build-system]
# setuptools >= 77 is required for PEP 639 license metadata (License-Expression).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-module"
# Single-sourced from src/sdr_module/__init__.py (__version__).
dynamic = ["version"]
description = "Dual-SDR framework for RTL-SDR and HackRF One: DSP, protocol decoding, PyQt6 GUI and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{name = "SDR Module contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Signal Processing",
    "Typing :: Typed",
]
keywords = ["sdr", "rtl-sdr", "hackrf", "radio", "dsp", "signal-processing"]

dependencies = [
    "numpy>=1.21.0,<3",
]

[project.optional-dependencies]
rtlsdr = [
    "pyrtlsdr>=0.2.92,<1",
]
# python_hackrf is built from source against the system libhackrf, so the
# libhackrf headers, a C compiler and CMake must be installed first. See the
# README section "Hardware drivers".
hackrf = [
    "python_hackrf>=1.5.0,<2",
]
dsp = [
    "scipy>=1.7.0,<2",
]
gui = [
    "PyQt6>=6.10.2,<7",
]
images = [
    # PNG/JPEG export of decoded SSTV images (falls back to .npy without it).
    "Pillow>=9.0",
]
# Everything that installs from wheels alone. The HackRF driver is deliberately
# not included because python_hackrf needs libhackrf and a compiler to build;
# add `[hackrf]` explicitly once those are present.
full = [
    "pyrtlsdr>=0.2.92,<1",
    "scipy>=1.7.0,<2",
    "PyQt6>=6.10.2,<7",
    "Pillow>=9.0",
]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.19.1",
    "ruff>=0.15.10",
    # The GUI test suite needs PyQt6; contributors should run it too.
    "PyQt6>=6.10.2,<7",
]

[project.urls]
Homepage = "https://github.com/kase1111-hash/SDR"
Repository = "https://github.com/kase1111-hash/SDR"
Issues = "https://github.com/kase1111-hash/SDR/issues"
Changelog = "https://github.com/kase1111-hash/SDR/blob/main/CHANGELOG.md"

[project.scripts]
sdr-scan = "sdr_module.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sdr_module.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
sdr_module = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sdr_module.gui.*", "sdr_module.ham.gui.*"]
disallow_untyped_defs = false
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus bugbear and the two bandit checks that catch
# silent exception swallowing and hard-coded temp paths.
extend-select = ["B", "S108", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
xfail_strict = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
