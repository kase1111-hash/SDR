[build-system]
# Cap setuptools below 77 because 77+ emits `Dynamic: license-file` in wheel
# METADATA which twine 6.2.0's validator rejects. Remove the upper bound once
# a twine release recognises PEP 639 metadata fields.
requires = ["setuptools>=61.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-module"
version = "0.2.0"
description = "Dual-SDR system for RTL-SDR and HackRF One"
readme = "README.md"
# NOTE: Stays on the classic `license = {text = ...}` form because twine 6.2.0
# rejects PEP 639 "License-Expression" / "License-File" metadata fields as
# unrecognized during `twine check`. Switch to `license = "MIT"` +
# `license-files = [...]` once twine learns about those fields.
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Signal Processing",
]
keywords = ["sdr", "rtl-sdr", "hackrf", "radio", "dsp", "signal-processing"]

dependencies = [
    "numpy>=1.21.0,<3",
]

[project.optional-dependencies]
rtlsdr = [
    "pyrtlsdr>=0.2.92,<1",
]
hackrf = [
    "hackrf>=1.0.0,<2",
]
full = [
    "pyrtlsdr>=0.2.92,<1",
    "hackrf>=1.0.0,<2",
    "scipy>=1.7.0,<2",
    "matplotlib>=3.4.0,<4",
    "PyQt6>=6.10.2,<7",
]
gui = [
    "PyQt6>=6.10.2,<7",
]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.19.1",
    "ruff>=0.15.10",
]

[project.urls]
Homepage = "https://github.com/kase1111-hash/SDR"
Repository = "https://github.com/kase1111-hash/SDR"
Issues = "https://github.com/kase1111-hash/SDR/issues"

[project.scripts]
sdr-scan = "sdr_module.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sdr_module.gui.*", "sdr_module.ham.gui.*"]
disallow_untyped_defs = false
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
